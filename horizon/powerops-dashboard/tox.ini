[tox]
minversion = 3.18.0
envlist = py3,pep8

[stestr]
test_path = ./poweropsdashboard/tests
top_dir = ./

[testenv]
basepython = python3
usedevelop = True
setenv =
    DJANGO_SETTINGS_MODULE = poweropsdashboard.test.settings
deps =
    -c{env:TOX_CONSTRAINTS_FILE:https://releases.openstack.org/constraints/upper/2025.1}
    -r{toxinidir}/requirements.txt
    -r{toxinidir}/test-requirements.txt
commands =
    {envpython} {toxinidir}/manage.py test poweropsdashboard.tests {posargs}

[testenv:pep8]
commands =
    flake8 poweropsdashboard
