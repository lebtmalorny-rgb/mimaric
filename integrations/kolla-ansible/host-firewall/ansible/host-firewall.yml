---
# Separate entry point. Never import site.yml, gather-facts.yml or deploy roles.
- name: Validate request and collect host firewall evidence
  hosts: "{{ host_firewall_hosts | default('baremetal') }}"
  gather_facts: false
  strategy: linear
  pre_tasks:
    - name: Check the supported Ansible controller version
      ansible.builtin.assert:
        that:
          - ansible_version.full is version('2.18', '>=')
          - ansible_version.full is version('2.19', '<')
        fail_msg: "Host firewall requires ansible-core 2.18.x."
      any_errors_fatal: true
      tags: always
    - name: Admit a complete mutation request before any remote task
      powerops_firewall_admission:
      when: host_firewall_mode | default('report') != 'report'
      register: host_firewall_admission
      any_errors_fatal: true
  roles:
    - role: host-firewall
      when: host_firewall_mode | default('report') == 'report' or host_firewall_admission.operation | default('') == 'apply'
  post_tasks:
    - name: Aggregate selected hosts in controller memory
      powerops_firewall_model:
        stage: aggregate
        hosts: "{{ ansible_play_hosts_all }}"
      register: host_firewall_report
      run_once: true
      become: false
      no_log: true
      when: host_firewall_mode | default('report') == 'report' or host_firewall_admission.operation | default('') == 'apply'

    - name: Validate every selected host plan before the first mutation
      powerops_firewall_admission:
        require_fresh: true
      register: host_firewall_admission
      any_errors_fatal: true
      when: host_firewall_mode | default('report') == 'apply' and host_firewall_admission.operation | default('') == 'apply'

    - name: Show firewall plan summary without saving report files
      ansible.builtin.debug:
        msg: "{{ host_firewall_report.summary }}"
      run_once: true
      when: host_firewall_mode | default('report') == 'report'

- name: Apply or restore owned firewalld rules one host at a time
  hosts: "{{ host_firewall_hosts | default('baremetal') if host_firewall_mode | default('report') != 'report' else [] }}"
  gather_facts: false
  strategy: linear
  serial: 1
  any_errors_fatal: true
  tasks:
    - name: Execute host firewall transaction
      ansible.builtin.import_role:
        name: host-firewall
        tasks_from: mutate.yml
